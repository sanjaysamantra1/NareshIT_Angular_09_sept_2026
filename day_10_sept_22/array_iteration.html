<script>
    let cars = ['Tata', 'Honda', 'Maruti', 'Hyundai'];

    // 1. for Loop
    for (let i = 0; i < cars.length; i++) {
        console.log(cars[i]);
    }
    console.log('================')

    // 2. for-in loop   ES_6  2015
    for (i in cars) {
        console.log(cars[i]);
    }
    console.log('================')

    // 3. for-of loop   ES_6  2015
    for (car of cars) {
        console.log(car);
    }
    console.log('================')

    // 4. forEach()
    cars.forEach((val) => {
        console.log(val)
    })
    console.log('================')

    function printCar(car) {
        console.log(car)
    }
    cars.forEach(printCar)
</script>
