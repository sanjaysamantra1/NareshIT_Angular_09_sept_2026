<script>
    let cars = ['Tata', 'Honda', 'Maruti'];

    console.log('Before Push: ', cars); //  ['Tata', 'Honda', 'Maruti'];
    cars.push('Hyundai');
    console.log('After Push: ', cars);  //  ['Tata', 'Honda', 'Maruti','Hyundai'];
    cars.pop();
    console.log('After pop: ', cars);  //  ['Tata', 'Honda', 'Maruti'];

    cars.unshift('Hyundai');
    console.log('After unshift: ', cars);  //  ['Hyundai' , 'Tata', 'Honda', 'Maruti'];
    cars.shift();
    console.log('After pop: ', cars);  //  ['Tata', 'Honda', 'Maruti'];

    console.log(cars.slice(1)); // start=1 , end=not mentioned
    console.log(cars.slice(1, 3)); // start=1 , end=3

    let boys = ['Bipul', 'Rahul', 'Deepak']
    let girls = ['Rina', 'Geeta', 'usha', 'Bipul']
    let students = boys.concat(girls);
    console.log(students)
</script>
