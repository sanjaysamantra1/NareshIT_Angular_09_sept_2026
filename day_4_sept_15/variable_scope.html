<script>
    var a = 10;   // Global Scope
    let b = 20;
    const c = 30;
    console.log(`a: ${a}`);
    console.log(`b: ${b}`);
    console.log(`c: ${c}`);
    
    function f1() {
        var a = 100;   // Function Scope
        let b = 200;
        const c = 300;
        console.log(`a: ${a}`);
        console.log(`b: ${b}`);
        console.log(`c: ${c}`);

        if (true) {
            var a = 1000;   // Block Scope
            let b = 2000;
            const c = 3000;
            console.log(`a: ${a}`);
            console.log(`b: ${b}`);
            console.log(`c: ${c}`);
        }
    }
    f1();
</script>
