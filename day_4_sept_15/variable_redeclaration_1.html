<script>
    var a = 10;
    let b = 20;
    const c = 30;
    console.log(`a: ${a}`);
    console.log(`b: ${b}`);
    console.log(`c: ${c}`);

    var a = 100;  // re-declaration : yes
    console.log(`a: ${a}`);
    
    var a = 1000;
    console.log(`a: ${a}`);

    let b = 200;  // Cannot redeclare  variable 'b'
    let c = 300;  // Cannot redeclare  variable 'c'
</script>
