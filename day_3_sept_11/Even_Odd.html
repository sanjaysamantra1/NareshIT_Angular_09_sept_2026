<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.css" rel="stylesheet">
</head>

<body>
    <h3 class="text-center">Even/Odd Example</h3>

    <script>
        let num = 5;
        if (num % 2 === 0) {
            console.log(`${num} is Even`);
        } else {
            console.log(`${num} is Odd`);
        }
    </script>
</body>

</html>
