<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.css" rel="stylesheet">
    <style>
        h1 {
            color: red;
        }

        img {
            height: 200px;
        }
    </style>
</head>

<body>
    <h1 class="text-center">Product List</h1>
    <hr />
    <div class="container">
        <div class="row">
            <div class="col-sm-6 offset-3">
                <input type="search" placeholder="Search Product..." class="form-control">
            </div>
            <div class="col-sm-3">
                <button class="btn btn-primary">Sort Asc</button>
                <button class="btn btn-secondary mx-1">Sort Desc</button>
            </div>
        </div>
        <div class="row productContainer mt-2">
        </div>
    </div>
    <script>
        // fetch products data from API , 
        async function fetchProducts() {
            let response = await fetch('https://fakestoreapi.com/products');
            let productArr = await response.json();
            console.log(productArr)

            // iterate that productArr and display each product in card format 
            let row = document.querySelector('.productContainer');
            for (product of productArr) {
                row.innerHTML += `
                 <div class="col-sm-3">
                    <div class="card">
                        <img src="${product.image}" class="card-img-top" alt="...">
                        <div class="card-body text-center">
                            <h5 class="card-title">${product.category}</h5>
                            <p class="card-text text-truncate">${product.title}</p>
                            <p class="card-text text-truncate">${product.description}</p>
                            <p class="card-text">${product.price}</p>
                            <p class="card-text">${product.rating.rate}*</p>
                            <a href="#" class="btn btn-primary">Buy Now</a>
                        </div>
                    </div>
                 </div>
                `
            }
        }
        fetchProducts()
    </script>
</body>

</html>
