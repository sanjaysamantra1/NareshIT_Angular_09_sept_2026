<script>
    let str = 'This is Javascript Training';

    console.log(str.slice(5));  // start=5
    console.log(str.substring(5));  // start=5

    console.log(str.slice(5, 12));  // start=5 , end=12
    console.log(str.substring(5, 12));  // start=5, end=12

    // slice() works with -ve index but substring doesnt work with -ve

    console.log(str.slice(5, -3));  // start=5 , end=-3
    console.log(str.substring(5, -3));  // start=5, end=-3 , not working
</script>
