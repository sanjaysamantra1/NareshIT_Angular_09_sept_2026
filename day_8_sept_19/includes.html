<script>
    let str = 'This is Javascript Training';

    console.log(str.includes('Java')); // true
    console.log(str.includes('Python')); // false

    console.log(str.startsWith('This')); // true
    console.log(str.startsWith('Training')); // false

    console.log(str.endsWith('Training')); // true
    console.log(str.endsWith('This')); // false
</script>
