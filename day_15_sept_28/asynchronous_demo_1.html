<script>
    console.log('Program Executions starts here...')

    async function fetch_users() {
        try {
            let response = await fetch('https://jsonplaceholder.typicode.com/users')
            let userArr = await response.json();
            console.log(userArr)
        } catch (error) {
            console.log(error)
        }
    }
    fetch_users();  // async 

    console.log('Program Executions ends here...')
</script>
